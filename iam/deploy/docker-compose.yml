name: iam-sso

services:
  iam-backend:
    build:
      context: ../iam_backend
    env_file:
      - .env.production
    expose:
      - "3101"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3101/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  iam-frontend:
    build:
      context: ../iam_frontend
    depends_on:
      iam-backend:
        condition: service_healthy
    ports:
      - "${IAM_HTTP_PORT:-8081}:80"
    restart: unless-stopped
